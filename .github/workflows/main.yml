name: Build GH777 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Swift Binary
        run: |
          # Forçando a arquitetura arm64 para ser compatível com iPhones modernos
          # Adicionado flag de otimização e linkage para evitar que o binário seja "simples demais"
          swiftc -O -target arm64-apple-ios14.0 ContentView.swift -o GH777

      - name: Create App Bundle Structure
        run: |
          mkdir -p Payload/GH777.app
          mv GH777 Payload/GH777.app/
          
          # Info.plist mais robusto para evitar detecção de "app vazio"
          cat <<EOF > Payload/GH777.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>GH777</string>
              <key>CFBundleIdentifier</key>
              <string>com.apple.mobile.MobileHouseArrest</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GH777</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          
          echo "APPL" > Payload/GH777.app/PkgInfo
          chmod +x Payload/GH777.app/GH777

      - name: Package as IPA
        run: |
          zip -r GH777.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-IPA
          path: GH777.ipa
