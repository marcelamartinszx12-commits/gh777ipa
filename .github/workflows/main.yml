name: Build GH777 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Swift Binary
        run: |
          # Agora usando o nome correto do seu arquivo: ContentView.swift
          swiftc -O ContentView.swift -o GH777

      - name: Create App Bundle Structure
        run: |
          # Cria a estrutura de pastas profissional (Bundle)
          mkdir -p Payload/GH777.app
          
          # Move o binário para dentro da pasta .app
          mv GH777 Payload/GH777.app/
          
          # Cria o Info.plist com o ID de sistema (MobileHouseArrest)
          cat <<EOF > Payload/GH777.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>GH777</string>
              <key>CFBundleIdentifier</key>
              <string>com.apple.mobile.MobileHouseArrest</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GH777</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF
          
          # Cria o arquivo PkgInfo
          echo "APPL" > Payload/GH777.app/PkgInfo
          
          # Garante que o binário tenha permissão de execução
          chmod +x Payload/GH777.app/GH777

      - name: Package as IPA
        run: |
          # Compacta a pasta Payload no formato .ipa correto
          zip -r GH777.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GH777-IPA
          path: GH777.ipa
