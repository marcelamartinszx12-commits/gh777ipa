name: Simple Build GH777

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build App
        run: |
          # Compilação direta sem dependências externas (Sem Firebase)
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios14.0 \
            ContentView.swift \
            -o GH777.app/GH777

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv GH777.app Payload/
          zip -r GH777.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: GH777-App
          path: GH777.ipa
