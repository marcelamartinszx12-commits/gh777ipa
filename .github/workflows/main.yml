name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Xcode Project Structure
        run: |
          mkdir -p GH777/ContentView.swift
          # Cria um arquivo de exportação básico para evitar erro de assinatura
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>' > export_options.plist

      - name: Build App
        run: |
          # Comando simplificado para compilar arquivos soltos em um binário
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios14.0 \
            ContentView.swift \
            -o GH777.app/GH777

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv GH777.app Payload/
          zip -r GH777.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GH777-App
          path: GH777.ipa
