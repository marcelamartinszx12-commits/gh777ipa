name: Final Build GH777

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Binary
        run: |
          # Compila o código como um executável de iOS
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios14.0 \
            -framework SwiftUI \
            -framework Foundation \
            ContentView.swift \
            -o GH777_binary

      - name: Create App Structure
        run: |
          mkdir -p GH777.app
          cp GH777_binary GH777.app/GH777
          # Cria um Info.plist básico para o iOS não rejeitar o app
          echo '<plist version="1.0"><dict><key>CFBundleExecutable</key><string>GH777</string><key>CFBundleIdentifier</key><string>com.gh777.app</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > GH777.app/Info.plist

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv GH777.app Payload/
          zip -r GH777.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App
          path: GH777.ipa
